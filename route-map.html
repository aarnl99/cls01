<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bay Area Route Coverage | CLS Global Transportation</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { font-family: 'Inter', sans-serif; background: #0A0A0D; color: #fff; }

#map { width: 100%; height: 100vh; position: relative; }
canvas { display: block; }

#back {
  position: fixed; top: 20px; left: 20px; z-index: 50;
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
  border-radius: 10px; padding: 9px 16px; color: rgba(255,255,255,0.8);
  font-size: 13px; font-weight: 600; text-decoration: none;
  font-family: 'Inter', sans-serif; display: flex; align-items: center; gap: 8px;
  backdrop-filter: blur(12px);
}
#back:hover { background: rgba(255,255,255,0.14); color: #fff; }

#title {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  text-align: center; z-index: 50; pointer-events: none;
}
#title h1 { font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.85); }
#title p { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 3px; }

#legend {
  position: fixed; bottom: 24px; left: 24px; z-index: 50;
  background: rgba(10,10,13,0.92); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px; padding: 16px 18px; backdrop-filter: blur(16px);
  min-width: 190px;
}
#legend h3 { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.3); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 10px; }
.leg { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.leg:last-child { margin-bottom: 0; }
.leg-line { width: 24px; height: 3px; border-radius: 2px; flex-shrink: 0; }
.leg-label { font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.6); }

#stats {
  position: fixed; bottom: 24px; right: 24px; z-index: 50;
  display: flex; flex-direction: column; gap: 8px;
}
.stat {
  background: rgba(10,10,13,0.92); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px; padding: 10px 16px; backdrop-filter: blur(16px); text-align: right;
}
.stat .v { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
.stat .l { font-size: 10px; color: rgba(255,255,255,0.35); margin-top: 1px; }

#tooltip {
  position: fixed; z-index: 60; pointer-events: none; opacity: 0;
  transition: opacity 0.15s;
  background: rgba(10,10,13,0.96); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px; padding: 12px 16px; min-width: 190px;
  backdrop-filter: blur(16px);
}
#tooltip.show { opacity: 1; }
#tooltip .tt-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 7px; }
#tooltip h4 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
#tooltip p { font-size: 12px; color: rgba(255,255,255,0.5); line-height: 1.5; }
</style>
</head>
<body>

<a href="index.html" id="back">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
  Back to CLS
</a>

<div id="title">
  <h1>Bay Area Route Coverage</h1>
  <p>Active corridors operated by CLS Global Transportation</p>
</div>

<div id="tooltip"></div>

<div id="legend">
  <h3>Route Type</h3>
  <div class="leg"><div class="leg-line" style="background:#C41E1E;"></div><span class="leg-label">Corporate Shuttle</span></div>
  <div class="leg"><div class="leg-line" style="background:#818CF8;"></div><span class="leg-label">Campus Transit</span></div>
  <div class="leg"><div class="leg-line" style="background:#FBBF24;"></div><span class="leg-label">Last Mile / BART</span></div>
  <div class="leg"><div class="leg-line" style="background:#34D399; background: repeating-linear-gradient(90deg,#34D399 0,#34D399 6px,transparent 6px,transparent 10px);"></div><span class="leg-label">Charter / Events</span></div>
</div>

<div id="stats">
  <div class="stat"><div class="v" style="color:#C41E1E;">40+</div><div class="l">Active Routes</div></div>
  <div class="stat"><div class="v">9</div><div class="l">Cities Served</div></div>
  <div class="stat"><div class="v">24/7</div><div class="l">Dispatch</div></div>
</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  draw();
}
window.addEventListener('resize', resize);

// Map bounds: lat/lng → pixel
// Bay Area: lat 37.1–38.1, lng -122.65 to -121.75
const LNG_MIN = -122.65, LNG_MAX = -121.75;
const LAT_MIN = 37.1,  LAT_MAX = 38.1;

function px(lat, lng) {
  const pad = 60;
  const w = canvas.width - pad * 2;
  const h = canvas.height - pad * 2;
  const x = pad + (lng - LNG_MIN) / (LNG_MAX - LNG_MIN) * w;
  const y = pad + (1 - (lat - LAT_MIN) / (LAT_MAX - LAT_MIN)) * h;
  return [x, y];
}

// --- Geography ---
const water = [
  // SF Bay approximate outline (clockwise from north)
  [38.07,-122.37],[38.05,-122.28],[37.98,-122.20],[37.92,-122.18],
  [37.85,-122.19],[37.78,-122.22],[37.73,-122.19],[37.67,-122.14],
  [37.60,-122.10],[37.55,-122.07],[37.52,-122.08],[37.50,-122.05],
  [37.49,-122.00],[37.50,-121.96],[37.54,-121.94],[37.60,-121.95],
  [37.65,-122.00],[37.70,-122.03],[37.75,-122.07],[37.80,-122.11],
  [37.86,-122.16],[37.90,-122.22],[37.95,-122.28],[38.00,-122.33],
  [38.05,-122.37],[38.07,-122.37]
];

// Bay islands / San Pablo Bay
const sanPabloBay = [
  [38.05,-122.37],[38.08,-122.42],[38.1,-122.48],[38.08,-122.55],
  [38.02,-122.52],[37.98,-122.47],[37.95,-122.42],[37.95,-122.37],
  [38.00,-122.33],[38.05,-122.37]
];

// Cities / nodes
const cities = [
  { name:'San Francisco', lat:37.774, lng:-122.419, type:'corporate',
    info:'Hub for 14 active corporate shuttle routes. Dispatch office on-site.' },
  { name:'Oakland', lat:37.804, lng:-122.271, type:'corporate',
    info:'East Bay dispatch hub. BART connections at 3 stations.' },
  { name:'San Jose', lat:37.338, lng:-121.886, type:'campus',
    info:'Adobe campus hub. 6 active routes, 1,200+ daily riders.' },
  { name:'Mountain View', lat:37.386, lng:-122.084, type:'corporate',
    info:'Tech corridor stop. Direct express from SF and East Bay.' },
  { name:'Redwood City', lat:37.485, lng:-122.236, type:'corporate',
    info:'Peninsula hub. Major Caltrain connection.' },
  { name:'Palo Alto', lat:37.441, lng:-122.143, type:'campus',
    info:'University and corporate corridor stop.' },
  { name:'Fremont', lat:37.548, lng:-121.989, type:'lastmile',
    info:'Neuralink campus. Last-mile from BART and Caltrain. 3-week launch.' },
  { name:'SFO', lat:37.621, lng:-122.379, type:'corporate',
    info:'Airport express service. Daily departures from SF and Peninsula.' },
  { name:'Napa Valley', lat:38.297, lng:-122.286, type:'event',
    info:'Wine country charter destination. Weekend and corporate event service.' },
];

const typeColors = {
  corporate: '#C41E1E',
  campus: '#818CF8',
  lastmile: '#FBBF24',
  event: '#34D399'
};

// Routes as [lat,lng] waypoints
const routes = [
  // SF to Mountain View (101 corridor)
  { type:'corporate', pts:[[37.774,-122.419],[37.700,-122.400],[37.621,-122.379],[37.550,-122.330],[37.485,-122.236],[37.441,-122.143],[37.386,-122.084]] },
  // Oakland to San Jose (880 corridor)
  { type:'corporate', pts:[[37.804,-122.271],[37.750,-122.200],[37.700,-122.150],[37.650,-122.080],[37.600,-122.000],[37.550,-121.950],[37.338,-121.886]] },
  // SF to Fremont (via BART)
  { type:'lastmile', pts:[[37.774,-122.419],[37.700,-122.350],[37.620,-122.200],[37.548,-121.989]] },
  // Fremont BART last mile
  { type:'lastmile', pts:[[37.557,-122.058],[37.548,-121.989]] },
  // Adobe inter-campus SJ
  { type:'campus', pts:[[37.338,-121.886],[37.350,-121.900],[37.360,-121.920]] },
  // SFO express
  { type:'corporate', pts:[[37.774,-122.419],[37.700,-122.410],[37.621,-122.379]] },
  // Napa charter
  { type:'event', pts:[[37.774,-122.419],[37.900,-122.450],[38.100,-122.480],[38.297,-122.286]] },
  // Palo Alto corridor
  { type:'campus', pts:[[37.774,-122.419],[37.650,-122.380],[37.550,-122.300],[37.441,-122.143]] },
];

// Animation
let progress = 0; // 0–1 overall
let pulseT = 0;
let animDone = false;
let cityHits = {}; // which cities have appeared

function drawWater(pts, color) {
  if (!pts.length) return;
  ctx.beginPath();
  const [sx, sy] = px(pts[0][0], pts[0][1]);
  ctx.moveTo(sx, sy);
  for (let i = 1; i < pts.length; i++) {
    const [x, y] = px(pts[i][0], pts[i][1]);
    ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

function drawRoute(route, frac, alpha) {
  if (frac <= 0) return;
  const pts = route.pts;
  // compute total length
  let segs = [];
  let total = 0;
  for (let i = 1; i < pts.length; i++) {
    const [x1,y1] = px(pts[i-1][0],pts[i-1][1]);
    const [x2,y2] = px(pts[i][0],pts[i][1]);
    const d = Math.hypot(x2-x1,y2-y1);
    segs.push({x1,y1,x2,y2,d});
    total += d;
  }
  const drawn = total * Math.min(frac, 1);
  let rem = drawn;
  const color = typeColors[route.type];

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = route.type === 'event' ? 2 : 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (route.type === 'event') {
    ctx.setLineDash([6, 5]);
  }

  ctx.beginPath();
  let started = false;
  for (const seg of segs) {
    if (rem <= 0) break;
    const draw = Math.min(rem, seg.d);
    const t = draw / seg.d;
    const mx = seg.x1 + (seg.x2 - seg.x1) * t;
    const my = seg.y1 + (seg.y2 - seg.y1) * t;
    if (!started) { ctx.moveTo(seg.x1, seg.y1); started = true; }
    ctx.lineTo(mx, my);
    rem -= draw;
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawCity(city, alpha, pulse) {
  const [x, y] = px(city.lat, city.lng);
  const col = typeColors[city.type];
  const r = 5 + pulse * 2;

  // Glow ring
  ctx.save();
  ctx.globalAlpha = alpha * 0.2 * (0.5 + pulse * 0.5);
  ctx.beginPath();
  ctx.arc(x, y, r + 8, 0, Math.PI * 2);
  ctx.fillStyle = col;
  ctx.fill();
  ctx.restore();

  // Dot
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.arc(x, y, 5, 0, Math.PI * 2);
  ctx.fillStyle = col;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x, y, 5, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();

  // Label
  ctx.save();
  ctx.globalAlpha = alpha * 0.85;
  ctx.font = '600 11px Inter, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.textBaseline = 'middle';
  // Offset label to avoid overlap
  const offX = city.name === 'San Francisco' ? 8 : 8;
  const offY = city.name === 'Mountain View' ? -12 : city.name === 'Palo Alto' ? -12 : 0;
  ctx.fillText(city.name, x + offX, y + offY);
  ctx.restore();
}

// Label SF Bay
function drawBayLabel() {
  const [x, y] = px(37.65, -122.18);
  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.font = '700 12px Inter, sans-serif';
  ctx.fillStyle = '#5aa8e0';
  ctx.textAlign = 'center';
  ctx.translate(x, y);
  ctx.rotate(-0.3);
  ctx.fillText('SAN FRANCISCO BAY', 0, 0);
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background
  ctx.fillStyle = '#0A0A0D';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Land background (whole canvas is land base)
  ctx.fillStyle = '#10111A';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // San Pablo Bay
  drawWater(sanPabloBay, '#0D1520');
  // SF Bay
  drawWater(water, '#0D1520');

  // Grid lines (subtle)
  ctx.save();
  ctx.globalAlpha = 0.04;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  for (let lat = 37.2; lat <= 38.1; lat += 0.1) {
    const [x1,y1] = px(lat, LNG_MIN);
    const [x2,y2] = px(lat, LNG_MAX);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }
  for (let lng = -122.6; lng <= -121.8; lng += 0.1) {
    const [x1,y1] = px(LAT_MIN, lng);
    const [x2,y2] = px(LAT_MAX, lng);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }
  ctx.restore();

  drawBayLabel();

  // Routes
  const totalRoutes = routes.length;
  routes.forEach((route, i) => {
    const start = i / totalRoutes;
    const frac = Math.max(0, (progress - start) / (1 / totalRoutes));
    drawRoute(route, frac, 0.85);
  });

  // Cities
  cities.forEach((city, i) => {
    const appear = i / cities.length;
    const alpha = Math.max(0, Math.min(1, (progress - appear) * cities.length * 0.5));
    if (alpha > 0) drawCity(city, alpha, Math.sin(pulseT + i * 0.9) * 0.5 + 0.5);
  });
}

let last = null;
function animate(ts) {
  if (!last) last = ts;
  const dt = (ts - last) / 1000;
  last = ts;
  if (!animDone) {
    progress = Math.min(1, progress + dt * 0.35);
    if (progress >= 1) animDone = true;
  }
  pulseT += dt * 1.2;
  draw();
  requestAnimationFrame(animate);
}

resize();
requestAnimationFrame(animate);

// Tooltip on mouse move
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  let found = null;
  for (const city of cities) {
    const [cx, cy] = px(city.lat, city.lng);
    if (Math.hypot(mx - cx, my - cy) < 16) { found = city; break; }
  }
  if (found) {
    const col = typeColors[found.type];
    const labels = { corporate:'Corporate', campus:'Campus', lastmile:'Last Mile', event:'Charter' };
    tooltip.innerHTML = `<div class="tt-tag" style="color:${col}">${labels[found.type]}</div><h4>${found.name}</h4><p>${found.info}</p>`;
    tooltip.style.left = (e.clientX + 16) + 'px';
    tooltip.style.top = (e.clientY - 10) + 'px';
    tooltip.classList.add('show');
    canvas.style.cursor = 'pointer';
  } else {
    tooltip.classList.remove('show');
    canvas.style.cursor = 'default';
  }
});
canvas.addEventListener('mouseleave', () => tooltip.classList.remove('show'));
</script>
</body>
</html>
