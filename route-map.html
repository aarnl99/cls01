<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bay Area Route Coverage | CLS Global Transportation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #0D0D0F; color: #fff; overflow: hidden; height: 100vh; }

#map-canvas {
  position: absolute; inset: 0;
  background: #0D0D0F;
}

/* SVG map */
.bay-area-map { width: 100%; height: 100%; }

/* Roads */
.road-major { stroke: #1E2030; stroke-width: 1.5; fill: none; }
.road-highway { stroke: #252840; stroke-width: 2.5; fill: none; }

/* Water */
.water { fill: #0F1824; }
.water-label { fill: #1A3048; font-size: 11px; font-weight: 500; letter-spacing: 0.05em; }

/* Land */
.land { fill: #111318; }
.land-alt { fill: #0F1014; }

/* CLS Routes */
.route-line {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0;
  animation: routeFadeIn 0.6s ease forwards;
}
.route-corporate { stroke: #C41E1E; stroke-width: 2.5; }
.route-campus { stroke: #818CF8; stroke-width: 2; }
.route-event { stroke: #34D399; stroke-width: 2; stroke-dasharray: 6 4; }
.route-lastmile { stroke: #FBBF24; stroke-width: 2; }

/* Animated dash for all routes */
.route-line { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: drawRoute 1.4s ease forwards; }
.route-line:nth-child(1) { animation-delay: 0.1s; }
.route-line:nth-child(2) { animation-delay: 0.3s; }
.route-line:nth-child(3) { animation-delay: 0.5s; }
.route-line:nth-child(4) { animation-delay: 0.7s; }
.route-line:nth-child(5) { animation-delay: 0.9s; }
.route-line:nth-child(6) { animation-delay: 1.1s; }
.route-line:nth-child(7) { animation-delay: 1.3s; }
.route-line:nth-child(8) { animation-delay: 1.5s; }

@keyframes drawRoute {
  to { stroke-dashoffset: 0; opacity: 1; }
}

/* City nodes */
.node-pulse {
  animation: nodePulse 2.4s ease-in-out infinite;
}
@keyframes nodePulse {
  0%, 100% { opacity: 0.3; r: 10; }
  50% { opacity: 0.7; r: 14; }
}

.node-dot { transition: r 0.2s; cursor: pointer; }
.node-dot:hover { r: 8; }

/* Tooltip */
#tooltip {
  position: fixed;
  background: rgba(13,13,15,0.96);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 14px 18px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
  z-index: 100;
  min-width: 200px;
  backdrop-filter: blur(16px);
}
#tooltip.show { opacity: 1; }
#tooltip h4 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
#tooltip p { font-size: 12px; color: rgba(255,255,255,0.55); line-height: 1.5; }
#tooltip .tt-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 4px;
  margin-bottom: 8px;
}

/* UI overlay */
#ui {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 10;
}

/* Back button */
#back {
  position: fixed;
  top: 20px; left: 20px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  padding: 10px 16px;
  color: rgba(255,255,255,0.7);
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  font-family: inherit;
  pointer-events: all;
  transition: background 0.2s;
  backdrop-filter: blur(10px);
  display: flex; align-items: center; gap: 8px;
  z-index: 20;
}
#back:hover { background: rgba(255,255,255,0.14); color: #fff; }

/* Title */
#title-box {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  pointer-events: none;
}
#title-box h1 {
  font-size: 15px;
  font-weight: 700;
  color: rgba(255,255,255,0.9);
  letter-spacing: -0.01em;
}
#title-box p {
  font-size: 12px;
  color: rgba(255,255,255,0.4);
  margin-top: 3px;
}

/* Legend */
#legend {
  position: fixed;
  bottom: 28px;
  left: 28px;
  background: rgba(13,13,15,0.9);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 18px 20px;
  pointer-events: all;
  backdrop-filter: blur(16px);
}
#legend h3 {
  font-size: 11px;
  font-weight: 700;
  color: rgba(255,255,255,0.3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: opacity 0.2s;
}
.legend-item:last-child { margin-bottom: 0; }
.legend-line {
  width: 28px;
  height: 2.5px;
  border-radius: 2px;
  flex-shrink: 0;
}
.legend-dash {
  background: repeating-linear-gradient(90deg,currentColor 0,currentColor 5px,transparent 5px,transparent 9px);
  height: 2px;
}
.legend-label {
  font-size: 12px;
  font-weight: 500;
  color: rgba(255,255,255,0.65);
}

/* Stats panel */
#stats {
  position: fixed;
  bottom: 28px;
  right: 28px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}
.stat-pill {
  background: rgba(13,13,15,0.9);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 12px 16px;
  backdrop-filter: blur(16px);
  text-align: right;
}
.stat-pill .val {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: #fff;
}
.stat-pill .lbl {
  font-size: 11px;
  color: rgba(255,255,255,0.4);
  margin-top: 1px;
}

/* Animated glowing dot */
@keyframes glow {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}
</style>
</head>
<body>

<a href="index.html" id="back">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>

<script>
const tooltip = document.getElementById('tooltip');

// Node hover tooltips
document.querySelectorAll('.node-dot').forEach(dot => {
  dot.addEventListener('mouseenter', (e) => {
    const city = dot.dataset.city;
    const info = dot.dataset.info;
    const type = dot.dataset.type;
    const colors = { corporate:'#C41E1E', campus:'#818CF8', lastmile:'#FBBF24', event:'#34D399' };
    const labels = { corporate:'Corporate', campus:'Campus', lastmile:'Last Mile', event:'Charter' };
    tooltip.innerHTML = `
      <span class="tt-badge" style="background:${colors[type]}22;color:${colors[type]}">${labels[type]}</span>
      <h4>${city}</h4>
      <p>${info}</p>
    `;
    tooltip.classList.add('show');
  });
  dot.addEventListener('mousemove', (e) => {
    tooltip.style.left = (e.clientX + 16) + 'px';
    tooltip.style.top = (e.clientY - 10) + 'px';
  });
  dot.addEventListener('mouseleave', () => {
    tooltip.classList.remove('show');
  });
});

// Legend filter toggle
document.querySelectorAll('.legend-item').forEach(item => {
  item.addEventListener('click', () => {
    const filter = item.dataset.filter;
    const lines = document.querySelectorAll('.route-line');
    const isActive = item.style.opacity === '0.4';
    item.style.opacity = isActive ? '1' : '0.4';
    lines.forEach(line => {
      if (line.classList.contains('route-' + filter)) {
        line.style.opacity = isActive ? '1' : '0';
      }
    });
  });
});
</script>
