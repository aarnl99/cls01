<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', () => { resize(); });
resize();

// --- Coordinate system ---
// We project lat/lng → pixel using a simple linear map
const BOUNDS = { lng0: -122.72, lng1: -121.65, lat0: 36.9, lat1: 38.4 };

function proj(lat, lng) {
  const pad = { t: 60, b: 40, l: 40, r: 40 };
  const W = canvas.width - pad.l - pad.r;
  const H = canvas.height - pad.t - pad.b;
  const x = pad.l + (lng - BOUNDS.lng0) / (BOUNDS.lng1 - BOUNDS.lng0) * W;
  const y = pad.t + (1 - (lat - BOUNDS.lat0) / (BOUNDS.lat1 - BOUNDS.lat0)) * H;
  return { x, y };
}

// --- Geography shapes ---
// SF Bay water (approximate polygon)
const BAY = [
  [38.07,-122.37],[38.03,-122.28],[37.98,-122.20],[37.92,-122.18],

const OCEAN = [

const DELTA = [

// --- Service zones (shaded areas showing CLS coverage) ---
const ZONES = [

  // Peninsula corridor
  { pts: [[37.75,-122.43],[37.75,-122.39],[37.42,-122.16],[37.42,-122.21]], color: 'rgba(196,30,30,0.07)', label: 'Peninsula' },
  // South Bay / San Jose
  { pts: [[37.42,-122.21],[37.42,-122.16],[37.28,-121.84],[37.28,-121.90]], color: 'rgba(129,140,248,0.10)', label: 'South Bay' },
  // East Bay

];

// --- Service pins (cities) ---
const PINS = [
  { name: 'San Francisco', sub: 'Main Dispatch Hub', lat: 37.775, lng: -122.418,
    times: 'Mon–Fri 5:30AM–10PM', desc: '14 active routes. Home base.', r: 8, color: '#C41E1E', big: true },
  { name: 'Oakland', sub: 'East Bay Hub', lat: 37.805, lng: -122.270,

  { name: 'San Jose', sub: 'Adobe Campus', lat: 37.337, lng: -121.887,

  { name: 'Mountain View', sub: 'Tech Corridor', lat: 37.386, lng: -122.083,

  { name: 'Redwood City', sub: 'Caltrain Hub', lat: 37.485, lng: -122.235,
    times: 'Mon–Fri 6AM–8:30PM', desc: 'Major Caltrain connection point.', r: 5, color: '#C41E1E' },
  { name: 'Palo Alto', sub: 'University Corridor', lat: 37.442, lng: -122.143,

  { name: 'Fremont', sub: 'Neuralink Campus', lat: 37.548, lng: -121.989,
    times: 'Mon–Fri 6AM–9PM', desc: 'Last-mile from BART + Caltrain.', r: 5, color: '#FBBF24' },
  { name: 'SFO Airport', sub: 'Airport Express', lat: 37.621, lng: -122.378,
    times: 'Daily 4AM–11PM', desc: 'Peninsula and SF pickups.', r: 5, color: '#C41E1E' },
  { name: 'Napa Valley', sub: 'Charter Destination', lat: 38.297, lng: -122.285,
    times: 'Weekends + Events', desc: 'Wine country and corporate events.', r: 4, color: '#34D399' },
  { name: 'Millbrae', sub: 'BART / Caltrain', lat: 37.600, lng: -122.388,
    times: 'Mon–Fri 6AM–9PM', desc: 'Transit connection hub.', r: 4, color: '#C41E1E' },
  { name: 'Burlingame', sub: 'Peninsula Stop', lat: 37.578, lng: -122.345,
    times: 'Mon–Fri 6:30AM–8PM', desc: 'Corporate campus stop.', r: 3, color: '#C41E1E' },
];

// --- Routes as animated moving lines ---
// Each route: array of [lat,lng] waypoints, with a moving dot
const ROUTES = [
  // SF to Mountain View (101 corridor)
  { pts: [[37.775,-122.418],[37.740,-122.410],[37.700,-122.400],[37.660,-122.380],[37.620,-122.378],[37.578,-122.345],[37.542,-122.303],[37.510,-122.258],[37.485,-122.235],[37.460,-122.183],[37.442,-122.143],[37.420,-122.120],[37.386,-122.083]], color: '#C41E1E', w: 1.8 },
  // SF to San Jose (via 280)
  { pts: [[37.775,-122.418],[37.730,-122.430],[37.690,-122.450],[37.645,-122.440],[37.600,-122.420],[37.555,-122.390],[37.515,-122.355],[37.475,-122.310],[37.440,-122.230],[37.400,-122.100],[37.365,-121.970],[37.337,-121.887]], color: '#818CF8', w: 1.8 },
  // Oakland to San Jose (880)
  { pts: [[37.805,-122.270],[37.760,-122.220],[37.720,-122.165],[37.680,-122.100],[37.640,-122.050],[37.600,-122.000],[37.565,-121.975],[37.548,-121.989],[37.520,-121.950],[37.460,-121.900],[37.400,-121.880],[37.337,-121.887]], color: '#C41E1E', w: 1.5 },
  // SF to Fremont (via BART corridor)
  { pts: [[37.775,-122.418],[37.730,-122.380],[37.690,-122.330],[37.650,-122.260],[37.610,-122.185],[37.570,-122.095],[37.548,-121.989]], color: '#FBBF24', w: 1.5 },
  // SF to Napa (charter)
  { pts: [[37.775,-122.418],[37.830,-122.440],[37.890,-122.470],[37.950,-122.490],[38.020,-122.470],[38.100,-122.450],[38.200,-122.380],[38.297,-122.285]], color: '#34D399', w: 1.5, dash: [6,5] },
  // SFO to Mountain View
  { pts: [[37.621,-122.378],[37.578,-122.345],[37.542,-122.303],[37.510,-122.258],[37.485,-122.235],[37.460,-122.183],[37.442,-122.143],[37.420,-122.120],[37.386,-122.083]], color: '#C41E1E', w: 1.4 },
  // Oakland to Fremont
  { pts: [[37.805,-122.270],[37.760,-122.195],[37.710,-122.095],[37.660,-122.040],[37.610,-122.000],[37.580,-121.995],[37.548,-121.989]], color: '#FBBF24', w: 1.4 },
  // SF Loop (downtown)
  { pts: [[37.775,-122.418],[37.790,-122.400],[37.800,-122.390],[37.810,-122.400],[37.800,-122.420],[37.785,-122.430],[37.775,-122.418]], color: '#C41E1E', w: 1.2 },
];

// Animated dots moving along routes
let routeDots = ROUTES.map((r, i) => ({
  t: Math.random(), // position 0–1 along route
  speed: 0.04 + Math.random() * 0.03,
  delay: i * 0.3,
  active: false,
}));

// Pin animation state
let pinProgress = 0; // 0–1 overall
let time = 0;
let started = Date.now();

// --- Draw helpers ---
function poly(pts, fill, stroke, sw) {
  if (!pts.length) return;
  ctx.beginPath();
  const p0 = proj(pts[0][0], pts[0][1]);
  ctx.moveTo(p0.x, p0.y);
  for (let i = 1; i < pts.length; i++) {
    const p = proj(pts[i][0], pts[i][1]);
    ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = sw || 1; ctx.stroke(); }
}

function routeLen(pts) {
  let total = 0;
  for (let i = 1; i < pts.length; i++) {
    const a = proj(pts[i-1][0], pts[i-1][1]);
    const b = proj(pts[i][0], pts[i][1]);
    total += Math.hypot(b.x - a.x, b.y - a.y);
  }
  return total;
}

function pointAt(pts, frac) {
  if (frac <= 0) { const p = proj(pts[0][0], pts[0][1]); return { x: p.x, y: p.y }; }
  if (frac >= 1) { const p = proj(pts[pts.length-1][0], pts[pts.length-1][1]); return { x: p.x, y: p.y }; }
  let segs = [];
  let total = 0;
  for (let i = 1; i < pts.length; i++) {
    const a = proj(pts[i-1][0], pts[i-1][1]);
    const b = proj(pts[i][0], pts[i][1]);
    const d = Math.hypot(b.x - a.x, b.y - a.y);
    segs.push({ ax: a.x, ay: a.y, bx: b.x, by: b.y, d });
    total += d;
  }
  let rem = frac * total;
  for (const seg of segs) {
    if (rem <= seg.d) {
      const t = rem / seg.d;
      return { x: seg.ax + (seg.bx - seg.ax) * t, y: seg.ay + (seg.by - seg.ay) * t };
    }
    rem -= seg.d;
  }
  return pointAt(pts, 1);
}

function drawRoute(route, alpha) {
  const pts = route.pts;
  ctx.save();
  ctx.globalAlpha = alpha * 0.6;
  ctx.strokeStyle = route.color;
  ctx.lineWidth = route.w || 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (route.dash) ctx.setLineDash(route.dash);
  ctx.beginPath();
  const p0 = proj(pts[0][0], pts[0][1]);
  ctx.moveTo(p0.x, p0.y);
  for (let i = 1; i < pts.length; i++) {
    const p = proj(pts[i][0], pts[i][1]);
    ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawMovingDot(route, dot) {
  const pos = pointAt(route.pts, dot.t);
  ctx.save();
  // Glow
  const grad = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, 8);
  grad.addColorStop(0, route.color + 'cc');
  grad.addColorStop(1, route.color + '00');
  ctx.globalAlpha = 0.9;
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, 8, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();
  // Core dot
  ctx.globalAlpha = 1;
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, 3, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.restore();
}

function drawPin(pin, alpha, pulse) {
  const p = proj(pin.lat, pin.lng);
  const r = pin.r || 5;
  const col = pin.color;

  // Outer pulse ring
  ctx.save();
  ctx.globalAlpha = alpha * 0.15 * pulse;
  ctx.beginPath();
  ctx.arc(p.x, p.y, r + 10 + pulse * 4, 0, Math.PI * 2);
  ctx.fillStyle = col;
  ctx.fill();
  ctx.restore();

  // Middle ring
  ctx.save();
  ctx.globalAlpha = alpha * 0.3 * pulse;
  ctx.beginPath();
  ctx.arc(p.x, p.y, r + 5, 0, Math.PI * 2);
  ctx.fillStyle = col;
  ctx.fill();
  ctx.restore();

  // Pin drop shadow
  ctx.save();
  ctx.globalAlpha = alpha * 0.25;
  ctx.beginPath();
  ctx.arc(p.x + 1, p.y + 2, r, 0, Math.PI * 2);
  ctx.fillStyle = '#000';
  ctx.fill();
  ctx.restore();

  // Main circle
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
  ctx.fillStyle = col;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();

  // Inner white dot
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.arc(p.x, p.y, r * 0.35, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.restore();

  // Label
  ctx.save();
  ctx.globalAlpha = alpha * 0.9;
  ctx.font = `${pin.big ? 600 : 500} ${pin.big ? 11 : 10}px Inter, sans-serif`;
  ctx.fillStyle = '#fff';
  ctx.textBaseline = 'middle';
  // Smart label placement
  let lx = p.x + r + 6;
  let ly = p.y;
  if (pin.name === 'Oakland') { lx = p.x + r + 6; ly = p.y - 2; }
  if (pin.name === 'Napa Valley') { lx = p.x - 70; ly = p.y - 14; }
  if (pin.name === 'SFO Airport') { lx = p.x + r + 6; ly = p.y; }
  ctx.fillText(pin.name, lx, ly);
  if (pin.big) {
    ctx.font = '500 9px Inter, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillText(pin.sub, lx, ly + 13);
  }
  ctx.restore();
}

// --- Faint road grid (highway lines) ---
const HIGHWAYS = [
  // 101 Peninsula
  [[37.775,-122.418],[37.740,-122.408],[37.700,-122.398],[37.620,-122.378],[37.578,-122.344],[37.542,-122.303],[37.510,-122.258],[37.485,-122.235],[37.442,-122.143],[37.386,-122.083],[37.337,-121.887]],
  // 280 (coastal)
  [[37.775,-122.418],[37.730,-122.432],[37.690,-122.452],[37.645,-122.442],[37.600,-122.418],[37.555,-122.390],[37.515,-122.355],[37.475,-122.310],[37.440,-122.230],[37.420,-122.120],[37.337,-121.887]],
  // 880 East Bay
  [[37.805,-122.270],[37.760,-122.218],[37.720,-122.165],[37.680,-122.100],[37.640,-122.050],[37.600,-122.000],[37.548,-121.989],[37.520,-121.950],[37.460,-121.900],[37.400,-121.880],[37.337,-121.887]],
  // 92 / 92 bridge
  [[37.577,-122.345],[37.572,-122.280],[37.572,-122.200],[37.580,-122.100]],
  // I-80 (Bay Bridge and east)
  [[37.775,-122.418],[37.790,-122.396],[37.804,-122.371],[37.810,-122.330],[37.810,-122.270],[37.810,-122.200],[37.810,-122.100]],
  // 101 North (to Napa)
  [[37.775,-122.418],[37.830,-122.438],[37.880,-122.460],[37.940,-122.498],[38.000,-122.520],[38.100,-122.520],[38.200,-122.465],[38.297,-122.285]],
  // 237 (Sunnyvale to Fremont)
  [[37.386,-122.083],[37.400,-122.030],[37.430,-121.980],[37.480,-121.950],[37.548,-121.989]],
];

// --- Main draw ---
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Sky gradient background
  const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
  bg.addColorStop(0, '#060910');
  bg.addColorStop(1, '#080B14');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Subtle dot grid
  ctx.save();
  ctx.globalAlpha = 0.025;
  ctx.fillStyle = '#fff';
  const gs = 28;
  for (let gx = 0; gx < canvas.width; gx += gs) {
    for (let gy = 0; gy < canvas.height; gy += gs) {
      ctx.beginPath();
      ctx.arc(gx, gy, 1, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();

  // Service zone shading
  ZONES.forEach(z => {
    const pts = z.pts.map(p => [p[0], p[1]]);
    ctx.beginPath();
    const p0 = proj(pts[0][0], pts[0][1]);
    ctx.moveTo(p0.x, p0.y);
    pts.slice(1).forEach(p => { const q = proj(p[0], p[1]); ctx.lineTo(q.x, q.y); });
    ctx.closePath();
    ctx.fillStyle = z.color;
    ctx.fill();
  });

  // Water
  poly(OCEAN, '#071424', '#0a1e35', 0.5);
  poly(SAN_PABLO, '#071424', '#0a1e35', 0.5);
  poly(BAY, '#071424', '#0a1e35', 0.5);
  poly(DELTA, '#071424', '#0a1e35', 0.5);

  // Bay label
  const bl = proj(37.65, -122.18);
  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = '#4a9ec4';
  ctx.font = '600 11px Inter, sans-serif';
  ctx.textAlign = 'center';
  ctx.translate(bl.x, bl.y);
  ctx.rotate(-0.28);
  ctx.fillText('SAN FRANCISCO BAY', 0, 0);
  ctx.restore();
  ctx.textAlign = 'left';

  // Highway lines
  HIGHWAYS.forEach(pts => {
    ctx.save();
    ctx.globalAlpha = 0.07;
    ctx.strokeStyle = '#8899cc';
    ctx.lineWidth = 1.2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    const p0 = proj(pts[0][0], pts[0][1]);
    ctx.moveTo(p0.x, p0.y);
    pts.slice(1).forEach(p => { const q = proj(p[0], p[1]); ctx.lineTo(q.x, q.y); });
    ctx.stroke();
    ctx.restore();
  });

  // Routes (static lines)
  ROUTES.forEach(r => drawRoute(r, 1));

  // Moving dots on routes
  routeDots.forEach((dot, i) => {
    if (dot.active) drawMovingDot(ROUTES[i], dot);
  });

  // Pins — drop in sequentially
  PINS.forEach((pin, i) => {
    const appear = i / PINS.length;
    const alpha = Math.max(0, Math.min(1, (pinProgress - appear) * PINS.length * 1.2));
    if (alpha <= 0) return;
    const pulse = (Math.sin(time * 1.5 + i * 0.8) * 0.5 + 0.5);
    drawPin(pin, alpha, pulse);
  });
}

// --- Animation loop ---
let lastTs = null;
function animate(ts) {
  if (!lastTs) lastTs = ts;
  const dt = (ts - lastTs) / 1000;
  lastTs = ts;
  time += dt;

  // Pins appear over first 3 seconds
  pinProgress = Math.min(1, time / 3);

  // Moving dots start after pins are mostly in
  routeDots.forEach((dot, i) => {
    if (time > 1.5 + i * 0.3) {
      dot.active = true;
      dot.t = (dot.t + dot.speed * dt) % 1;
    }
  });

  draw();
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// --- Tooltip ---
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const my = (e.clientY - rect.top) * (canvas.height / rect.height);
  let found = null;
  PINS.forEach(pin => {
    const p = proj(pin.lat, pin.lng);
    if (Math.hypot(mx - p.x, my - p.y) < 20) found = pin;
  });
  if (found) {
    tooltip.innerHTML = `
      <div class="tt-name">${found.name}</div>
      <div class="tt-time">${found.times}</div>
      <div class="tt-desc">${found.sub} — ${found.desc}</div>
    `;
    tooltip.style.left = Math.min(e.clientX + 16, window.innerWidth - 240) + 'px';
    tooltip.style.top = Math.max(10, e.clientY - 20) + 'px';
    tooltip.classList.add('show');
    canvas.style.cursor = 'pointer';
  } else {
    tooltip.classList.remove('show');
    canvas.style.cursor = 'default';
  }
});
canvas.addEventListener('mouseleave', () => tooltip.classList.remove('show'));
</script>
